<p-dialog
  [modal]="true"
  [closable]="false"
  [visible]="VisibilityFile"
  (onHide)="closeForm()"
  [style]="{width: '700px'}"
  [styleClass]="'p-dialog-header-sm rounded-2xl'"
  appendTo="body"
>
  <!-- Header con gradiente -->
  <ng-template pTemplate="header">
    <div class="w-full bg-gradient-to-r from-orange-500 to-orange-600 px-6 py-5 rounded-t-2xl">
      <div class="flex items-center justify-between w-full">
        <!-- Contenedor izquierdo: icono + texto -->
        <div class="flex items-center gap-4">
          <div class="bg-white/20 rounded-xl p-3">
            <i class="pi pi-file-edit text-white text-2xl"></i>
          </div>
          <div>
            <h2 class="text-2xl font-bold text-white m-0">Histórico de Conversación</h2>
            <p class="text-sm text-orange-100 m-0 mt-1"></p>
          </div>
        </div>

        <!-- Botón de cierre alineado a la derecha -->
        <button
          class="bg-white/20 hover:bg-white/30 rounded-full p-3 transition-all cursor-pointer border-none outline-none"
          (click)="closeForm()">
          <i class="pi pi-times text-white text-xl font-bold"></i>
        </button>
      </div>
    </div>
  </ng-template>

    <div class="p-6">
    <!-- Rectángulo gris claro con texto "iniciar conversación" -->
    <div class="bg-slate-100 rounded-xl p-6 text-center hover:bg-slate-200 transition-colors cursor-pointer border-2 border-dashed border-slate-300">
      <div class="flex flex-col items-center gap-3">
        <div class="bg-white rounded-full p-4 shadow-sm">
          <i class="pi pi-comments text-orange-500 text-3xl"></i>
        </div>
        <span class="text-slate-600 font-medium text-lg">iniciar conversación</span>
      </div>
    </div>
  </div>

   <ng-template pTemplate="footer">
    <div class="flex items-center gap-2 w-full">
      <input
            pInputText
            id="username"
            class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:border-orange-300 focus:ring-2 focus:ring-orange-100 outline-none transition-all"
            autocomplete="off"
          />
      <p-button
        pInputText
        label="Enviar"
        severity="info"
        icon="pi pi-send"
        styleClass="p-button-primary"
      ></p-button>
    </div>
  </ng-template>
</p-dialog>
