<p-dialog
  [modal]="true"
  [closable]="false"
  [visible]="VisibilityDocumentation"
  (onHide)="closeForm()"
  [style]="{width: '700px'}"
  [styleClass]="'p-dialog-header-sm rounded-2xl'"
  appendTo="body"
>
  <!-- Header con gradiente -->
  <ng-template pTemplate="header">
    <div class="w-full bg-gradient-to-r from-orange-500 to-orange-600 px-6 py-5 rounded-t-2xl">
      <div class="flex items-center justify-between w-full">
        <!-- Contenedor izquierdo: icono + texto -->
        <div class="flex items-center gap-4">
          <div class="bg-white/20 rounded-xl p-3">
            <i class="pi pi-file-edit text-white text-2xl"></i>
          </div>
          <div>
            <h2 class="text-2xl font-bold text-white m-0">Expediente del Reclamo</h2>
            <p class="text-sm text-orange-100 m-0 mt-1"></p>
          </div>
        </div>

        <!-- Botón de cierre alineado a la derecha -->
        <button
          class="bg-white/20 hover:bg-white/30 rounded-full p-3 transition-all cursor-pointer border-none outline-none"
          (click)="closeForm()">
          <i class="pi pi-times text-white text-xl font-bold"></i>
        </button>
      </div>
    </div>
  </ng-template>

<div class="p-6">
  <div class="bg-slate-100 rounded-xl p-6 border-2 border-dashed border-slate-300 space-y-6">

    <!-- Checkboxes con más espaciado -->
    <div class="flex flex-col gap-4">
      <div *ngFor="let category of categories; let last = last"
           class="flex items-center p-2 hover:bg-slate-200/50 rounded-lg transition-colors"
           [class.mb-2]="!last">
        <p-checkbox
          [inputId]="category.key"
          name="group"
          [value]="category"
          [(ngModel)]="selectedCategories"
        />
        <label [for]="category.key" class="ml-3 text-slate-700 font-medium cursor-pointer flex-1">
          {{ category.name }}
        </label>
      </div>
    </div>

    <!-- Separador -->
    <div class="border-t border-slate-300 my-4"></div>

  </div>
</div>
</p-dialog>
