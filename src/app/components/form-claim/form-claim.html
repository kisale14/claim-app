<p-dialog
  [modal]="true"
  [closable]="false"
  [visible]="VisibilityForm"
  (onHide)="closeForm()"
  class="rounded-2xl overflow-hidden"
  [styleClass]="'p-dialog-header-sm'"
  appendTo="body"
  >

  <!-- Header personalizado con título llamativo -->
  <ng-template pTemplate="header">
    <div class="w-full bg-gradient-to-r from-orange-500 to-orange-600 px-6 py-5 -mt-2 -mx-2 rounded-t-2xl">
      <div class="flex items-center gap-3">
        <div class="bg-white/20 rounded-full p-3">
          <i class="pi pi-file-edit text-white text-xl"></i>
        </div>
        <div>
          <h2 class="text-2xl font-bold text-white m-0">Formulario de Reclamo</h2>
          <p class="text-sm text-orange-100 m-0 mt-1">Completa los datos para registrar tu reclamo</p>
        </div>
      </div>
    </div>
  </ng-template>

  <!-- Contenido del formulario -->
  <div class="px-2 py-4">
    <!-- Campo Usuario con diseño mejorado -->
    <div class="mb-5">
      <label for="username" class="block text-sm font-semibold text-slate-700 mb-2">
        <i class="pi pi-user mr-2 text-orange-500"></i>
        Nombre de Usuario
      </label>
      <div class="relative">
        <i class="pi pi-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input
          pInputText
          id="username"
          class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:border-orange-300 focus:ring-2 focus:ring-orange-100 outline-none transition-all"
          autocomplete="off"
          placeholder="ej. juan.perez"
        />
      </div>
      <p class="text-xs text-slate-400 mt-1">Ingresa tu nombre de usuario registrado</p>
    </div>

    <!-- Campo Email con diseño mejorado -->
    <div class="mb-6">
      <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">
        <i class="pi pi-envelope mr-2 text-orange-500"></i>
        Correo Electrónico
      </label>
      <div class="relative">
        <i class="pi pi-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input
          pInputText
          id="email"
          class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:border-orange-300 focus:ring-2 focus:ring-orange-100 outline-none transition-all"
          autocomplete="off"
          placeholder="ej. correo@ejemplo.com"
        />
      </div>
      <p class="text-xs text-slate-400 mt-1">Te enviaremos la confirmación a este correo</p>
    </div>

    <!-- Línea divisoria decorativa -->
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-slate-200"></div>
      </div>
      <div class="relative flex justify-center">
        <span class="bg-white px-4 text-xs text-slate-400">información del reclamo</span>
      </div>
    </div>

    <!-- Campo adicional para reclamo -->
    <div class="mb-6">
      <label for="reclamo" class="block text-sm font-semibold text-slate-700 mb-2">
        <i class="pi pi-comment mr-2 text-orange-500"></i>
        Detalle del Reclamo
      </label>
      <textarea
        pInputTextarea
        id="reclamo"
        rows="3"
        class="w-full p-3 border border-slate-200 rounded-xl focus:border-orange-300 focus:ring-2 focus:ring-orange-100 outline-none transition-all resize-none"
        placeholder="Describe brevemente tu reclamo..."
      ></textarea>
      <p class="text-xs text-slate-400 mt-1">Máximo 500 caracteres</p>
    </div>
  </div>

  <!-- Footer con botones mejorados -->
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-3 px-2 pb-4">
    <button pButton severity="danger" (click)="closeForm()">
      <i class="pi pi-times" pButtonIcon></i>
      <span pButtonLabel>Cancelar</span>
    </button>
    <button pButton (click)="closeForm()">
      <i class="pi pi-check" pButtonIcon></i>
      <span pButtonLabel>Crear</span>
    </button>
    </div>
  </ng-template>
</p-dialog>
